<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haunted Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0807;color:#d8cfc0;font-family:"Special Elite",monospace;min-height:100vh}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0003 2px 3px),radial-gradient(ellipse at center,transparent 50%,#000c);z-index:9}
body.flick main{animation:fl .25s steps(2) 2}@keyframes fl{50%{opacity:.4;filter:hue-rotate(90deg)}}
main{max-width:500px;margin:0 auto;padding:16px 14px 60px}
h1{font-family:Creepster,cursive;font-size:2.6rem;color:#b3121b;text-align:center;margin:10px 0 0;text-shadow:0 0 12px #f00a,2px 2px #000;letter-spacing:2px}
.meter{margin:10px 0;border:1px solid #5a1a1a;padding:10px;border-radius:6px;background:#140c0b}.meter .b{height:12px;background:#2a1414;border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#4a0,#b3121b,#600);transition:width 1s}
.narr{font-style:italic;color:#c9a96b;border-left:3px solid #b3121b;padding:8px 12px;background:#140c0b;margin:12px 0;min-height:3em}
.panel{background:#151110;border:1px solid #3a2a26;border-radius:8px;padding:12px;margin:12px 0}
input,button{font:inherit;padding:11px;border-radius:6px;border:1px solid #4a3530;background:#0d0a09;color:#e8dccb}input{width:100%;margin:4px 0}button{cursor:pointer;background:#3a0d10;border-color:#7a1a1f}
.row{display:flex;gap:6px}.row>*{flex:1}
.ev{padding:10px;border-bottom:1px dashed #3a2a26;display:flex;gap:8px;align-items:center}.ev .d{font-size:.75rem;color:#a8968a;width:70px}.ev .n{flex:1;min-width:0;overflow-wrap:anywhere}.ev .x{background:none;border:0;color:#b06060;min-width:44px;min-height:44px}
.glitch{position:relative;display:inline-block;color:#ff5560}.glitch:hover,.glitch.g,.glitch.heavy{animation:gl .35s steps(3) infinite}
@keyframes gl{0%{text-shadow:2px 0 #0ff,-2px 0 #f0f;transform:translate(1px)}50%{text-shadow:-2px 0 #0ff,2px 0 #f0f;transform:translate(-1px,1px) skewX(-6deg)}}
.glitch.heavy:before,.glitch.heavy:after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
.glitch.heavy:before{color:#0ff;left:2px;clip-path:inset(0 0 60% 0);animation:sl 1.6s steps(4) infinite;mix-blend-mode:screen}
.glitch.heavy:after{color:#f0f;left:-2px;clip-path:inset(55% 0 0 0);animation:sl 1.1s steps(3) infinite reverse;mix-blend-mode:screen}
@keyframes sl{0%{clip-path:inset(0 0 70% 0)}25%{clip-path:inset(40% 0 30% 0)}50%{clip-path:inset(80% 0 5% 0)}75%{clip-path:inset(15% 0 55% 0)}}
@media (prefers-reduced-motion:reduce){.glitch,.glitch:before,.glitch:after,body.flick main{animation:none!important}}
.day{font-family:Creepster;color:#9a2a2a;font-size:1.2rem;margin-top:10px}.tog{display:flex;align-items:center;gap:8px;justify-content:center}label.f{display:block;text-align:center}
button{min-height:44px}</style></head><body><main>
<h1>Haunted Calendar</h1>
<div class="meter"><div style="display:flex;justify-content:space-between"><span>Possession</span><span id="lvl"></span></div><div class="b"><i id="bar"></i></div><small id="lvln"></small></div>
<div class="narr" id="narr"></div>
<div class="tog"><button id="real">👁 Show real names</button></div>
<div class="panel"><b>Summon an event</b><input id="name" maxlength="200" aria-label="Event name" placeholder="Dentist, Work shift, Laundry..."><div class="row"><input id="date" aria-label="Date" type="date"><input id="time" aria-label="Time" type="time"></div><button id="add" style="width:100%">Add to the calendar</button></div>
<div id="list"></div>
<div class="panel row"><button id="imp" onclick="document.getElementById('file').click()">📥 Import .ics</button><input type="file" id="file" accept=".ics,text/calendar" hidden><button id="exp">📤 Export real .ics</button></div>
<p style="text-align:center;font-size:.75rem;opacity:.75">Possession grows with each day you return. <a href="#" id="exo" style="color:#c06060;display:inline-block;padding:16px 6px">Perform exorcism</a></p>
</main><script src="app.js"></script></body></html>
